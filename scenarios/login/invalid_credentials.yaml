# Scenario: Invalid Credentials Authentication Attempt
# Tests that invalid credentials render form errors and fail gracefully.
id: invalid_credentials
name: Invalid credentials login attempt
tags: [regression, login, negative]
credentials:
  login_id: "0000000000"
  password: "invalid_password"
steps:
  - inspect_widget_tree: true
  - enter_text:
      key: login.id
      value: "0000000000"
  - enter_text:
      key: login.password
      value: "invalid_password"
  - tap:
      key: login.submit
assertions:
  - widget_present: login.id
